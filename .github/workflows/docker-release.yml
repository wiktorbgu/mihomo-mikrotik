name: Mihomo Docker Release

on:
  # Check for a new stable Mihomo release once a day
  schedule:
    - cron: "37 11 * * *"

  # Manual build
  workflow_dispatch:
    inputs:
      version:
        description: "Mihomo release tag (empty = latest)"
        required: false
        type: string

permissions: {}

concurrency:
  group: mihomo-docker-release
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve Mihomo version
    runs-on: self-hosted
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$MANUAL_VERSION" ]; then
            VERSION="${MANUAL_VERSION#refs/tags/}"
          else
            RELEASE_JSON=$(curl -fsSL \
              --retry 3 \
              --retry-delay 2 \
              https://api.github.com/repos/MetaCubeX/mihomo/releases/latest)

            VERSION=$(jq -er '.tag_name | select(type == "string" and length > 0)' <<< "$RELEASE_JSON")
          fi

          if [ -z "$VERSION" ]; then
            echo "ERROR: Unable to resolve Mihomo release"
            exit 1
          fi

          PREVIOUS=$(sed -n 's/^mihomo=//p' .github/versions 2>/dev/null || true)

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$VERSION" != "$PREVIOUS" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Current Mihomo release: $VERSION"
          echo "Previous Mihomo release: ${PREVIOUS:-none}"

  build:
    name: Build ${{ matrix.variant }}
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            tag: latest
            version_suffix: ""
            with_gvisor: "0"
            upx: "0"
          - variant: gvisor
            tag: gvisor
            version_suffix: "-gvisor"
            with_gvisor: "1"
            upx: "0"
          - variant: upx
            tag: upx
            version_suffix: "-upx"
            with_gvisor: "0"
            upx: "1"
          - variant: upx-gvisor
            tag: upx-gvisor
            version_suffix: "-upx-gvisor"
            with_gvisor: "1"
            upx: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
            linux/arm/v7
            linux/arm/v5
          build-args: |
            MIHOMO_VERSION=${{ needs.resolve.outputs.version }}
            WITH_GVISOR=${{ matrix.with_gvisor }}
            UPX=${{ matrix.upx }}
          push: true
          tags: |
            ghcr.io/wiktorbgu/mihomo-mikrotik:${{ matrix.tag }}
            ghcr.io/wiktorbgu/mihomo-mikrotik:${{ needs.resolve.outputs.version }}${{ matrix.version_suffix }}
            docker.io/wiktorbgu/mihomo-mikrotik:${{ matrix.tag }}
            docker.io/wiktorbgu/mihomo-mikrotik:${{ needs.resolve.outputs.version }}${{ matrix.version_suffix }}
          cache-from: |
            type=gha,scope=mihomo-standard
            type=gha,scope=mihomo-gvisor
            type=gha,scope=mihomo-upx
            type=gha,scope=mihomo-upx-gvisor
          cache-to: type=gha,mode=max,scope=mihomo-${{ matrix.variant }}

  save-version:
    name: Save processed Mihomo version
    needs: [resolve, build]
    if: needs.resolve.outputs.build == 'true' && needs.build.result == 'success'
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Update processed version
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .github
          touch .github/versions

          if grep -q '^mihomo=' .github/versions; then
            sed -i "s/^mihomo=.*/mihomo=$VERSION/" .github/versions
          else
            echo "mihomo=$VERSION" >> .github/versions
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/versions

          if ! git diff --cached --quiet; then
            git commit -m "chore: update Mihomo version to $VERSION"
            git push
          fi
